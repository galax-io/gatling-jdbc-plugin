# Scala Steward repo configuration
# Docs: https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# Gatling is a Provided host-runtime dependency: version moves are a deliberate maintainer
# decision (compatibility-sensitive), never a bot PR. The runtime artifacts are ignored outright,
# by name: gatling-core, gatling-core-java and gatling-test-framework, plus the whole
# io.gatling.highcharts group (gatling-charts-highcharts). The io.gatling:gatling-sbt build plugin
# (project/plugins.sbt) is deliberately not ignored: it is on its own 4.x track and keeps getting
# PRs.
# Remove the Gatling entries only when a Gatling upgrade is deliberately undertaken.
updates.ignore = [
  { groupId = "io.gatling", artifactId = "gatling-core" },
  { groupId = "io.gatling", artifactId = "gatling-core-java" },
  { groupId = "io.gatling", artifactId = "gatling-test-framework" },
  { groupId = "io.gatling.highcharts" },
  # Scala 2 -> 3 is a language edition migration, not a routine dependency bump — it needs a
  # deliberate, planned port, not an automated PR. Drop this once that migration happens.
  { groupId = "org.scala-lang", artifactId = "scala-library" }
]

# Conventional Commits, matching cliff.toml's "^chore\(deps\)" Dependencies group.
commits.message = "chore(deps): update ${artifactName} from ${currentVersion} to ${nextVersion}"
